# Pre-merge quality gate — enforced lint + phpcs + all Hydra gates on every PR.
# Required status check on protected branches.
#
# Runner/container mirror the proven release-semrel workflow: codeberg-medium +
# official php:8.3-cli + a base-tooling step. The old code.forgejo.org/oci/ci-php:8.3
# image 404s ("manifest unknown"), which fast-failed every run at container-pull.
#
# The gate runs `composer lint` + `composer phpcs` directly, because running the
# full analyser set on the medium runner OOMs it.
#
# NB the older justification here ("psalm/phpstan/phpmd/test:all are wrapped in
# `|| echo skipping` so they never affect pass/fail") is no longer true and was
# only ever true of phpmd + test:all. As of 2026-08-02:
#   psalm   — plain `./vendor/bin/psalm`,   real gate, 0 findings
#   phpstan — plain `./vendor/bin/phpstan`, real gate, 0 findings
#   phpmd   — plain `./vendor/bin/phpmd`,   real gate as of this commit
#   test:all — still ends `|| echo`, deliberately (needs a Nextcloud env; see
#              composer.json). Measured: the suite actually passes standalone
#              (754 tests) and only exits 1 on a "no code coverage driver"
#              warning, so that `|| echo` is a candidate for removal once a
#              coverage driver is available on the runner.
# Those four run on GitHub via the shared quality.yml workflow, which invokes the
# composer scripts. lint+phpcs remains the enforced subset here.

name: pre-merge-check-strict

on:
  pull_request:
    branches:
      - development
      - main
      - beta

jobs:
  quality-gates:
    runs-on: codeberg-medium
    container:
      image: php:8.3-cli
    timeout-minutes: 15
    steps:
      - name: Install base tooling
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            git curl ca-certificates gnupg jq unzip zip \
            libzip-dev libpng-dev python3
          # Node is required by actions/checkout@v4 (a JS action) which runs
          # inside this php:8.3-cli container; the stock image ships no node.
          curl -fsSL https://deb.nodesource.com/setup_20.x | bash -
          apt-get install -y --no-install-recommends nodejs
          docker-php-ext-install -j"$(nproc)" zip gd
          curl -sS https://getcomposer.org/installer | php -- --install-dir=/usr/local/bin --filename=composer

      - name: Checkout PR
        uses: https://github.com/actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install composer deps
        run: composer install --no-interaction --no-progress --prefer-dist --ignore-platform-reqs

      - name: Run lint + phpcs (the enforced gate)
        run: |
          composer lint
          composer phpcs

      - name: Clone Hydra (for gate runner)
        uses: https://github.com/actions/checkout@v4
        with:
          repository: Conduction/hydra
          ref: development
          path: .hydra

      - name: Run all Hydra gates (diff-scoped per ADR-020)
        run: |
          git fetch origin ${{ github.base_ref }}:${{ github.base_ref }} || true
          bash .hydra/scripts/run-hydra-gates.sh --scope-to-diff --base origin/${{ github.base_ref }} .

      - name: Gate-19 e2e coverage report (informational)
        if: always()
        run: |
          python3 .hydra/scripts/lib/check_e2e_coverage.py . --mode report || true
