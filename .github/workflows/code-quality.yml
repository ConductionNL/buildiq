name: Code Quality

on:
  push:
    branches: [main, development, feature/**, bugfix/**, hotfix/**]
  pull_request:
    branches: [main, master, development, beta]
  workflow_dispatch:

jobs:
  quality:
    uses: ConductionNL/.github/.github/workflows/quality.yml@main
    with:
      app-name: openbuild
      php-version: "8.3"
      php-test-versions: '["8.3", "8.4"]'
      nextcloud-test-refs: '["stable31", "stable32", "stable33"]'
      enable-psalm: true
      enable-phpstan: true
      enable-phpmetrics: true
      enable-frontend: true
      enable-eslint: true
      enable-phpunit: true
      # Run the Hydra mechanical quality gates against this PR's diff.
      #
      # Deliberately no count here: the gate set is the composer package
      # `conduction/hydra-gates` and that package is the single source of truth
      # for which gates exist and how many actually report. A digit written into
      # prose goes stale silently and then misrepresents the coverage this repo
      # has. See https://github.com/ConductionNL/.github/tree/main/hydra-gates
      #
      # Without this, wiring the gates into `composer check:strict` would have
      # been a LOCAL-ONLY change: nothing in this repository's CI runs
      # check:strict — there is no workflow that invokes it — so every PR would
      # have gone green with the gates never having executed. A gate that only
      # runs on a developer's machine is not a gate.
      #
      # Pinned to a tag rather than `main` so a change to the gates cannot alter
      # this repo's verdict without a commit in this repo to move the pin.
      enable-hydra-gates: true
      hydra-gates-ref: v1.0.1
      # Newman stays disabled while the openbuild#33 fixes are in flight.
      # The collection bugs in this PR are fixed (uuid `@self.id` extraction,
      # `export-job` slug correction, hello-world `@self.slug` fallback). But
      # an upstream OR-side infrastructure blocker still prevents the seed
      # from running in CI:
      #
      #   1. `OpenBuild: SeedHelloWorld failed: Call to undefined function
      #      React\Async\await()` — OR's runtime-schema-API on `development`
      #      pulls `react/async` but the composer dependency isn't surfacing
      #      in the CI install, so the function isn't autoloaded.
      #   2. SQLite (`database: sqlite`) trips
      #      `[PermissionHandler] no such function: REGEXP` from OR's
      #      MagicMapper. The query uses MySQL's REGEXP operator which
      #      SQLite doesn't ship.
      #
      # Blocker 2 is now moot — see the `database:` note below — but 1 is
      # untested since. File those as their own issues; once both are
      # confirmed unblocked, flip this back to `true` and re-evaluate.
      enable-newman: false
      # ── Back to the shared workflow's own default, pgsql ──────────────────
      #
      # `database: sqlite` was set in May 2026 (44bb3aeb) because OpenRegister's
      # migrations did not install cleanly on pgsql at the time: `relation
      # "oc_openregister_objects" does not exist` during CREATE INDEX, plus a
      # MySQL-ism `syntax error at or near "LIKE"`. sqlite was "the most lenient
      # backend and needs no service container".
      #
      # It is no longer lenient enough. SQLite has no `information_schema`, and
      # OpenRegister's MagicMapper reads `information_schema.columns` to create
      # and reconcile the per-schema magic tables that every OpenBuild object
      # lives in. Measured on run 30858649136, with the register import itself
      # reporting success and all 15 schema slugs verified present:
      #
      #   [ImportHandler] Failed to reconcile magic table for imported schema
      #     … schema_slug: built-app-route …
      #     SQLSTATE[HY000]: General error: 1 no such table: information_schema.columns
      #   Failed to seed hello-world fixture: Failed to create/update table for
      #     register 'OpenBuild Register' + schema 'Application': … same error
      #
      # So on sqlite the schemas exist but NOTHING can be stored against them —
      # no application, no version, no page. That is unusable for the e2e suite
      # and, note, it is the same class of defect as the REGEXP one recorded
      # above for Newman, just a different query.
      #
      # The May migration failures do not reproduce: planix runs this same
      # workflow against `ConductionNL/openregister@development` on the default
      # pgsql and its `E2E Tests (Playwright)` job is green (run 30851679874).
      # The `database:` input feeds the phpunit, newman, playwright and
      # journeydoc jobs; phpunit here is mock-based and only needs `occ
      # maintenance:install` to succeed, which is what the postgres service
      # container the shared workflow starts for pgsql provides.
      database: pgsql
      newman-seed-command: 'php occ app:disable openbuild && php occ app:enable openbuild'
      # OpenRegister `development` carries the runtime-schema-API (auto-create
      # Register on application-type imports — OR PR #1464) and the lifecycle
      # engine (ObjectTransitionedEvent) that OpenBuild's repair steps + the
      # Newman publish step need; `main` predates both. See openbuild#29.
      additional-apps: '[{"repo":"ConductionNL/openregister","app":"openregister","ref":"development"}]'
      enable-sbom: true

      # ── E2E browser tests ────────────────────────────────────────────────
      # Previously LEFT OFF, so `quality / E2E Tests (Playwright)` reported
      # `skipped` on every run — and a skipped job is visually indistinguishable
      # from a passing one in the PR checks list. 48 spec files carrying ~327
      # assertions existed in this repo and none of them had ever run in CI.
      #
      # Three things had to be true before this could be switched on, and each
      # of them fails SILENTLY when it is not:
      #
      #  1. The register must actually be imported. `occ app:enable openbuild`
      #     runs InitializeSettings, which imports as an IRepairStep — i.e. with
      #     NO user session — so OpenRegister's RBAC denies it, the exception is
      #     caught and downgraded to a warning, and `app:enable` still exits 0.
      #     FIXED by not relying on it: ci-seed.sh performs the import explicitly
      #     over the admin HTTP API (POST /apps/openbuild/api/settings/load →
      #     reloadConfiguration(force: true), which is also the only path that
      #     deep-merges the ADR-037 register.d/*.json fragments) and then VERIFIES
      #     all 15 schema slugs plus the register, so a bad provision is one loud
      #     step failure instead of a wall of misleading spec failures.
      #
      #  2. The `hello-world` fixture and the wizard's rate-limit exemption must
      #     be applied. tests/e2e/global-setup.ts does both, but only by
      #     resolving the DOCKER CONTAINER publishing the port under test. On a
      #     runner Nextcloud is a bare `php -S`, so that resolution returns null
      #     and both steps are skipped with a console warning nothing reads.
      #     Without the fixture, ~13 spec files open an empty app; without the
      #     exemption, ApplicationCreationController::wizard()'s
      #     #[UserRateLimit(limit: 10, period: 3600)] starts returning 429
      #     mid-run. FIXED: ci-seed.sh does both with `occ` directly.
      #
      #  3. The frontend bundle must actually serve. A missing bundle does not
      #     404 — Nextcloud returns its HTML error page with HTTP 200 and
      #     Content-Type text/html, which every status check reads as success.
      #     FIXED: ci-seed.sh gates on the SERVED content type being JavaScript.
      #
      #  4. The database had to move off sqlite. See the `database:` note above:
      #     OR's MagicMapper reads `information_schema.columns`, which SQLite
      #     does not have, so every magic table creation failed and no OpenBuild
      #     object could be stored at all — while the register import itself
      #     reported success and all 15 schema slugs verified present.
      enable-playwright: true
      # Double duty in the shared workflow: it is both the directory the
      # "Validate Playwright tests exist" step counts *.spec.ts in, AND the FIRST
      # place the run step looks for a config, falling back to the repo root only
      # if that file is absent. We ship tests/e2e/playwright.config.ts precisely
      # so that lookup hits it: the run step passes no `--project`, so the ROOT
      # config would additionally run `docs-capture` (re-shooting every
      # documentation screenshot on every PR) and `visual` (whose own PNG
      # baselines cannot byte-match on a CI runner — see the root config's
      # PLATFORM CAVEAT). Both projects stay declared in the root config, which
      # is untouched: the separate `Journeydoc Capture` job hard-fails unless the
      # root config still declares `docs-capture`.
      playwright-test-path: tests/e2e
      # cwd for this step is the Nextcloud server root.
      playwright-seed-command: 'bash apps/openbuild/tests/e2e/ci-seed.sh'
