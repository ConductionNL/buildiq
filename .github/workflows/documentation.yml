name: Documentation

on:
  push:
    branches: [development]
  pull_request:
    branches: [development]

jobs:
  deploy:
    uses: ConductionNL/.github/.github/workflows/documentation.yml@main
    # A called workflow receives NO secrets from its caller unless they are
    # passed explicitly or inherited — `with:` carries inputs, never secrets.
    # Without this line `secrets.CF_API_TOKEN` is EMPTY inside the callee, so
    # its "Publish to the Cloudflare Worker" step skips itself on its own
    # guard and the run finishes GREEN having written only gh-pages, which
    # nothing serves. The live site never changes and no check goes red to
    # say so — the exact failure mode the pinned inputs below guard against,
    # arriving one layer earlier.
    secrets: inherit
    with:
      # FROZEN on the old host: docs/docusaurus.config.js `url:` and
      # docs/static/CNAME both still say `openbuild.conduction.nl`. This moves
      # to `buildiq.conduction.nl` together with those two, not before — the
      # callee's live-site check fetches this host.
      cname: openbuild.conduction.nl

      # EVERY host this site answers on, in FULL. This was MISSING, and that
      # was not a cosmetic gap: `docs-hosts` defaults to `cname` alone, and
      # wrangler reconciles the worker's triggers against what it is given —
      # so the first successful deploy would have REMOVED
      # `buildiq.conduction.nl` from the worker and taken the new host down.
      # Both were attached as custom domains on 2026-08-23 and both serve 200.
      docs-hosts: openbuild.conduction.nl,buildiq.conduction.nl

      # The worker that holds both custom domains. It happens to match what
      # the callee would derive from `cname` today, which is exactly why it is
      # pinned here: the moment `cname` moves to `buildiq.conduction.nl` the
      # derived name silently becomes `buildiq-docs`, a worker that does not
      # exist, and the deploy forks off a second worker while both custom
      # domains keep routing to this one — green, and reaching nobody.
      worker-name: openbuild-docs
