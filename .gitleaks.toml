# gitleaks configuration: the default rules, plus allowlists for findings
# that are not secrets. Each allowlist names the exact files and only the
# rules that fire there, so anything else in those files is still reported.

[extend]
useDefault = true

[[allowlists]]
description = "Documentation examples: the default admin:admin login of the local development and demo containers."
targetRules = ["curl-auth-user"]
paths = [
  '''(^|/)docs/Installation/demo\-environment\.md$''',
]

[[allowlists]]
description = "Installation guide example: curl with the default admin:admin login of the local development container."
targetRules = ["curl-auth-user"]
paths = [
  '''(^|/)docs/installation\.md$''',
]

[[allowlists]]
description = "Unit test: a made-up sequential hex share token."
targetRules = ["generic-api-key"]
paths = [
  '''(^|/)tests/Unit/Controller/GeneratedDocumentControllerTest\.php$''',
]

[[allowlists]]
description = "Unit test: a fake PEM block (body abc) the test proves is stripped before publishing."
targetRules = ["private-key"]
paths = [
  '''(^|/)tests/Unit/Service/PublishedRepoSecretsTest\.php$''',
]
