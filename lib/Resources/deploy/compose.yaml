# Runs {{appName}} on its own Nextcloud with OpenRegister.
# Copy .env.example to .env, set the passwords, then run `docker compose up -d`.
name: {{appId}}

volumes:
  db:
  nextcloud:
  apps:

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: nextcloud
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in deploy/.env}
      POSTGRES_DB: nextcloud
    volumes:
      - db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nextcloud -d nextcloud"]
      interval: 5s
      timeout: 3s
      retries: 20

  app-installer:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: "no"
    environment:
      OPENREGISTER_VERSION: ${OPENREGISTER_VERSION:?Set OPENREGISTER_VERSION in deploy/.env}
    volumes:
      - apps:/apps

  nextcloud:
    image: nextcloud:${NEXTCLOUD_VERSION:-{{nextcloudVersion}}}-apache
    restart: unless-stopped
    ports:
      - "${PORT:-8080}:80"
    depends_on:
      db:
        condition: service_healthy
      app-installer:
        condition: service_completed_successfully
    environment:
      POSTGRES_HOST: db
      POSTGRES_USER: nextcloud
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in deploy/.env}
      POSTGRES_DB: nextcloud
      NEXTCLOUD_ADMIN_USER: ${NEXTCLOUD_ADMIN_USER:?Set NEXTCLOUD_ADMIN_USER in deploy/.env}
      NEXTCLOUD_ADMIN_PASSWORD: ${NEXTCLOUD_ADMIN_PASSWORD:?Set NEXTCLOUD_ADMIN_PASSWORD in deploy/.env}
      NEXTCLOUD_TRUSTED_DOMAINS: ${TRUSTED_DOMAINS:-localhost}
    volumes:
      - nextcloud:/var/www/html
      - apps:/var/www/html/custom_apps
    configs:
      - source: enable-apps
        target: /docker-entrypoint-hooks.d/post-installation/10-enable-apps.sh
        mode: "0755"

# A config, not a bind mount: Nextcloud skips a hook that is not executable,
# and an unpacked archive does not keep the execute bit.
configs:
  enable-apps:
    file: ./enable-apps.sh
