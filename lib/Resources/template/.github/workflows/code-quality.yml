name: Code Quality

on:
  push:
    branches: [main, development, feature/**, bugfix/**, hotfix/**]
  pull_request:
    branches: [main, master, development, beta]
  workflow_dispatch:

jobs:
  quality:
    uses: ConductionNL/.github/.github/workflows/quality.yml@main
    with:
      app-name: app-template
      php-version: "8.3"
      php-test-versions: '["8.3", "8.4"]'
      # No `nextcloud-test-refs` override: the shared quality.yml derives the
      # Nextcloud matrix from appinfo/info.xml (min/max-version), so every
      # declared major (32..35) gets a leg without editing this file.
      enable-psalm: true
      enable-phpstan: true
      enable-phpmetrics: true
      enable-frontend: true
      enable-eslint: true
      enable-phpunit: true
      enable-newman: true
      # additional-apps: '[]'  # Add app dependencies here if needed, e.g.:
      # additional-apps: '[{"repo":"ConductionNL/openregister","app":"openregister","ref":"main"}]'
      enable-sbom: true
