publiccodeYmlVersion: "0.4"

name: Buildiq
url: "https://codeberg.org/Conduction/buildiq"
softwareVersion: "0.3.7"
releaseDate: "2026-05-26"
developmentStatus: beta
softwareType: "standalone/other"

platforms:
  - nextcloud

categories:
  - project-management
  - it-service-management

description:
  en:
    shortDescription: >
      Construction project management and built environment administration for Nextcloud.
    longDescription: >
      Buildiq is a project management and administration application for the built
      environment, built on Nextcloud and Open Register. It supports construction
      project management, permit tracking, and built-environment administration for
      municipalities and construction organisations. Buildiq integrates with Dutch
      government standards and open data sources for the built environment.
    features:
      - Construction project management
      - Permit tracking and administration
      - Built environment data management
      - Integration with Dutch government open data

  nl:
    shortDescription: >
      Bouwprojectbeheer en omgevingsadministratie voor Nextcloud.
    longDescription: >
      Buildiq is een projectbeheers- en administratietoepassing voor de gebouwde
      omgeving, gebouwd op Nextcloud en Open Register. Het ondersteunt bouwprojectbeheer,
      vergunningenbewaking en omgevingsadministratie voor gemeenten en bouworganisaties.
      Buildiq integreert met Nederlandse overheidsstandaarden en open databronnen
      voor de gebouwde omgeving.
    features:
      - Bouwprojectbeheer
      - Vergunningenbewaking en -administratie
      - Databeheer gebouwde omgeving
      - Integratie met open data van de Nederlandse overheid

