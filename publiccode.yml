description:
  en:
    shortDescription: >
      App builder for Nextcloud: compose apps from registers, connectors,
      workflows and documents without code.
    longDescription: >
      Buildiq is an app builder for Nextcloud. It lets non-technical users
      compose apps from OpenRegister schemas, OpenConnector APIs, workflows,
      documents and NL Design themes through a visual interface, without
      writing PHP for each new app. Each built app is described by a manifest
      stored in OpenRegister and rendered at runtime, with its behaviour
      declared as schema metadata instead of service code. Built apps start as
      virtual apps inside Buildiq and can be exported to a real Nextcloud app.
      Buildiq is available in the Nextcloud App Store at
      https://apps.nextcloud.com/apps/buildiq.
      Conduction maintains this component within the Nextcloud ISV programme.
    features:
      - App creation wizard with identity, versions and permissions steps
      - Versioned app deployment with development, staging and production versions
      - Version promotion with a choice of how existing data is migrated
      - Bookmarkable preview of a version through the address
      - Maintainer dashboard per app with usage figures and activity
      - One Nextcloud navigation entry per published app
      - Templates marketplace with starter apps
      - Visual schema designer and page designer
      - Authoring tools for AI assistants over MCP
      - Export of a built app to a real Nextcloud app

  nl:
    shortDescription: >
      App builder voor Nextcloud: stel apps samen uit registers, connectors,
      processen en documenten zonder code.
    longDescription: >
      Buildiq is een app builder voor Nextcloud. Niet-technische gebruikers
      stellen apps samen uit OpenRegister-schema's, OpenConnector-API's,
      processen, documenten en NL Design-thema's via een visuele interface,
      zonder voor elke nieuwe app PHP te schrijven. Elke gebouwde app wordt
      beschreven door een manifest dat in OpenRegister staat en tijdens
      gebruik wordt weergegeven; het gedrag staat als schema-metadata
      vastgelegd in plaats van als servicecode. Gebouwde apps beginnen als
      virtuele apps binnen Buildiq en kunnen worden geëxporteerd naar een
      echte Nextcloud-app.
      Buildiq is beschikbaar in de Nextcloud App Store op
      https://apps.nextcloud.com/apps/buildiq.
      Conduction onderhoudt dit component binnen het Nextcloud ISV-programma.
    features:
      - Wizard voor een nieuwe app met stappen voor identiteit, versies en rechten
      - Versiebeheer met ontwikkel-, test- en productieversies
      - Promotie van een versie met een keuze hoe bestaande gegevens meegaan
      - Een versie vooraf bekijken via een deelbaar adres
      - Beheeroverzicht per app met gebruikscijfers en activiteit
      - Eén Nextcloud-menu-item per gepubliceerde app
      - Sjablonenmarkt met startapps
      - Visuele schema-ontwerper en pagina-ontwerper
      - Bouwgereedschap voor AI-assistenten via MCP
      - Export van een gebouwde app naar een echte Nextcloud-app

